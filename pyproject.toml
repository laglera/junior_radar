[project]
name = "radar-junior"
version = "0.1.0"
description = "El mercado real del primer empleo: análisis de 11M de ofertas de trabajo para perfiles junior."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pandas>=2.2",
    "pyarrow>=17",
    "plotly>=5.24",
    "kaggle>=1.6",
    "six>=1.17.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ruff>=0.7",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_junior"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
